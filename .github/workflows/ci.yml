name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# The build needs a database URL: lib/auth.ts constructs the better-auth
# MongoDB adapter at module scope, so every route importing it throws during
# Next's page-data collection without one. Set a DATABASE_URL repository
# secret to enable the build step; lint and typecheck run either way.
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧹 Run ESLint
        run: bun run lint

      - name: 🔍 Type check
        run: bun run typecheck

      - name: 🔐 Admin auth guards
        run: bun scripts/check-admin.ts

      - name: 🌍 Globe invariants
        run: bun scripts/check-globe.ts

      - name: ⚙️ Build project
        if: ${{ env.DATABASE_URL != '' }}
        run: bun run build
